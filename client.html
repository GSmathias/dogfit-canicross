<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080808">
  <title>Área do Cliente | DOGFIT CANICROSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/client.css">
  <style>.account-consent{display:grid!important;grid-template-columns:22px 1fr!important;gap:10px!important;align-items:start;padding:13px;border:1px solid rgba(255,103,0,.28);background:rgba(255,103,0,.05);color:#c8c8c3;font-size:.73rem;cursor:pointer}.account-consent input{width:18px!important;height:18px!important;min-height:0!important;margin-top:2px;accent-color:#ff6700}.account-consent span{font-weight:500!important;line-height:1.45}</style>
</head>
<body>
  <header class="client-header">
    <a class="client-brand" href="/"><strong>DOGFIT</strong><span>ÁREA DO CLIENTE</span></a>
    <a class="back-link" href="/">← Voltar ao site</a>
  </header>

  <main class="client-main">
    <section class="auth-shell" id="authShell">
      <div class="auth-intro">
        <p class="eyebrow">DOGFIT CANICROSS</p>
        <h1>SEUS DADOS.<br><span>SUAS AVENTURAS.</span></h1>
        <p>Salve as informações suas e do seu cão, acompanhe pré-inscrições e, se for membro do Clube, acesse sua carteirinha e a rede credenciada.</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" type="button" data-auth="login">Entrar</button>
          <button class="auth-tab" type="button" data-auth="register">Criar conta</button>
        </div>

        <form id="loginForm" class="client-form auth-form active">
          <label><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label>
          <label><span>Senha</span><input name="password" type="password" autocomplete="current-password" required></label>
          <p class="form-error" data-error="login"></p>
          <button class="primary-button" type="submit">ENTRAR →</button>
        </form>

        <form id="registerForm" class="client-form auth-form">
          <label class="wide"><span>Nome completo</span><input name="full_name" autocomplete="name" required maxlength="180"></label>
          <label><span>Data de nascimento</span><input name="birth_date" type="date" autocomplete="bday"></label>
          <label><span>Contato</span><input name="phone" type="tel" autocomplete="tel" required maxlength="30"></label>
          <label class="wide"><span>E-mail</span><input name="email" type="email" autocomplete="email" required maxlength="180"></label>
          <label><span>Nome do cachorro</span><input name="dog_name" maxlength="120"></label>
          <label><span>Raça</span><input name="dog_breed" maxlength="120"></label>
          <label><span>Quantidade de cães</span><input name="dog_count" type="number" min="1" max="10" value="1"></label>
          <label><span>Sociabilidade</span><select name="sociability"><option value="social">Sociável</option><option value="selective">Seletivo</option><option value="reactive">Reativo/agressivo</option><option value="unknown">Não sei informar</option></select></label>
          <label class="wide"><span>Crie uma senha <small>mínimo 8 caracteres</small></span><input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
          <label class="account-consent wide"><input name="privacy_accepted" type="checkbox" required><span>Autorizo a DOGFIT a armazenar estes dados para preencher futuras inscrições, manter meu histórico e vincular minha conta ao Clube quando os e-mails forem iguais.</span></label>
          <p class="form-error wide" data-error="register"></p>
          <button class="primary-button wide" type="submit">CRIAR MINHA CONTA →</button>
        </form>
      </div>
    </section>

  </main>

  <div class="toast" id="clientToast" role="status"></div>
  <script src="js/client.js"></script>
</body>
</html>
